name: paper-gate-tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Risk and paper-gate tests (no network, no keys)
        run: python -m unittest tests/test_paper_gate.py
