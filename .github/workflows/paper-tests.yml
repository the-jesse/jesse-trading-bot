name: paper-tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: stdlib paper and risk tests
        run: PYTHONPATH=src python -m unittest tests.test_paper_executor tests.test_risk_manager
